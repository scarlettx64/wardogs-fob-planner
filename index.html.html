<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WARDOGS FOB Planner</title>
<style>
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; font-family: system-ui, sans-serif; background:#12151a; color:#e8e8e8; overflow:hidden; }
  #app { display:flex; height:100%; }
  #sidebar { width:260px; background:#1a1e25; border-right:1px solid #2a3038; display:flex; flex-direction:column; }
  #sidebar h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:#8a94a3; padding:14px 14px 6px; margin:0; }
  #catalog { flex:1; overflow-y:auto; padding:0 10px 10px; }
  .cat { padding:9px 10px; margin:5px 0; background:#232932; border-radius:6px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; }
  .cat:hover { background:#2c3440; }
  .cat small { color:#7f8a99; }
  #toolbar { display:flex; gap:6px; padding:10px; border-top:1px solid #2a3038; flex-wrap:wrap; }
  button { background:#2c3440; color:#e8e8e8; border:1px solid #3a4351; padding:7px 11px; border-radius:6px; cursor:pointer; font-size:12px; }
  button:hover { background:#3a4351; }
  button:disabled { opacity:.4; cursor:default; }
  #main { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:absolute; top:12px; left:12px; background:#1a1e25dd; border:1px solid #2a3038; border-radius:8px; padding:10px 14px; font-size:13px; backdrop-filter:blur(6px); }
  #hud b.over { color:#ff6b6b; }
  .bar { height:8px; background:#2a3038; border-radius:4px; margin-top:6px; width:200px; overflow:hidden; }
  .bar > div { height:100%; background:#3ba55d; }
  .bar > div.over { background:#e04f4f; }
  #hint { position:absolute; bottom:12px; left:12px; font-size:12px; color:#6b7684; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h2>Structures</h2>
    <div id="catalog"></div>
    <div id="toolbar">
      <button id="undo" disabled>Undo</button>
      <button id="clear">Clear</button>
      <button id="exportPng">PNG</button>
      <button id="exportJson">JSON</button>
      <button id="importJson">Import</button>
      <button id="share">Share Link</button>
    </div>
  </div>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="hud">
      Budget: <b id="spent">0</b> / <span id="cap">2000</span>
      <div class="bar"><div id="fill"></div></div>
      <div id="warn" style="margin-top:6px;color:#ff6b6b;display:none">⚠ Over budget</div>
    </div>
    <div id="hint">Click a structure to place · Drag to move · Right-click to delete · Scroll to zoom · Middle-drag to pan</div>
  </div>
</div>
<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
const CELL = 40, GRID_W = 24, GRID_H = 18, BUDGET = 2000;

const CATALOG = [
  {name:"Command Post", cost:400, size:[3,3], clearance:2, power:-10, color:"#4a7fd4"},
  {name:"Barracks",     cost:250, size:[4,3], clearance:1, power:-5,  color:"#d4a24a"},
  {name:"Generator",    cost:300, size:[2,2], clearance:2, power:40,  color:"#4ad47f"},
  {name:"Armory",       cost:350, size:[3,2], clearance:1, power:-8,  color:"#a24ad4"},
  {name:"MG Nest",      cost:150, size:[2,2], clearance:1, power:0,   color:"#d44a4a"},
  {name:"Supply Depot", cost:200, size:[3,3], clearance:1, power:-4,  color:"#4ad4d4"}
];

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let placed = [], history = [], view = { x: 0, y: 0, scale: 1 };
let drag = null, pan = null, hover = null;

function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio;
  cv.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  draw();
}
addEventListener('resize', resize);

function worldToScreen(wx, wy){
  return [ (wx * CELL + view.x) * view.scale, (wy * CELL + view.y) * view.scale ];
}
function screenToWorld(sx, sy){
  return [ (sx / view.scale - view.x) / CELL, (sy / view.scale - view.y) / CELL ];
}

function canPlace(s, x, y, ignore){
  const [w,h] = s.size;
  if (x < 0 || y < 0 || x + w > GRID_W || y + h > GRID_H) return false;
  for (const p of placed){
    if (p === ignore) continue;
    const [pw,ph] = p.struct.size;
    const pad = Math.max(s.clearance, p.struct.clearance);
    if (x < p.x+pw+pad && x+w+pad > p.x && y < p.y+ph+pad && y+h+pad > p.y) return false;
  }
  return true;
}

function pushHistory(){
  history.push(JSON.stringify(placed.map(p=>({name:p.struct.name,x:p.x,y:p.y}))));
  if (history.length > 50) history.shift();
  document.getElementById('undo').disabled = history.length < 2;
}

function snapshot(){ return JSON.stringify(placed.map(p=>({name:p.struct.name,x:p.x,y:p.y}))); }

function addStruct(s){
  for (let y=0;y<GRID_H;y++) for (let x=0;x<GRID_W;x++){
    if (canPlace(s,x,y)){ pushHistory(); placed.push({struct:s,x,y}); draw(); update(); return; }
  }
  alert("No room — clear some space.");
}

function update(){
  const spent = placed.reduce((a,p)=>a+p.struct.cost,0);
  document.getElementById('spent').textContent = spent;
  const over = spent > BUDGET;
  document.getElementById('spent').className = over ? 'over' : '';
  document.getElementById('warn').style.display = over ? 'block' : 'none';
  const fill = document.getElementById('fill');
  fill.style.width = Math.min(100, spent/BUDGET*100) + '%';
  fill.className = over ? 'over' : '';
}

function draw(){
  const w = cv.width/devicePixelRatio, h = cv.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#0e1116';
  ctx.fillRect(0,0,w,h);

  // grid
  ctx.strokeStyle = '#1c2128';
  ctx.lineWidth = 1;
  for (let x=0;x<=GRID_W;x++){
    const [sx] = worldToScreen(x,0);
    ctx.beginPath(); ctx.moveTo(sx, worldToScreen(0,0)[1]); ctx.lineTo(sx, worldToScreen(0,GRID_H)[1]); ctx.stroke();
  }
  for (let y=0;y<=GRID_H;y++){
    const [,sy] = worldToScreen(0,y);
    ctx.beginPath(); ctx.moveTo(worldToScreen(0,0)[0], sy); ctx.lineTo(worldToScreen(GRID_W,0)[0], sy); ctx.stroke();
  }

  // structures
  for (const p of placed){
    const [w0,h0] = p.struct.size;
    const [sx,sy] = worldToScreen(p.x, p.y);
    const sw = w0*CELL*view.scale, sh = h0*CELL*view.scale;
    ctx.fillStyle = p.struct.color + '55';
    ctx.strokeStyle = p.struct.color;
    ctx.lineWidth = 2;
    ctx.fillRect(sx,sy,sw,sh);
    ctx.strokeRect(sx,sy,sw,sh);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(9, 11*view.scale)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.struct.name, sx+sw/2, sy+sh/2);
  }

  // hover preview
  if (hover){
    const [sx,sy] = worldToScreen(hover.x, hover.y);
    const sw = hover.struct.size[0]*CELL*view.scale;
    const sh = hover.struct.size[1]*CELL*view.scale;
    ctx.fillStyle = hover.valid ? '#3ba55d44' : '#e04f4f44';
    ctx.strokeStyle = hover.valid ? '#3ba55d' : '#e04f4f';
    ctx.setLineDash([6,4]);
    ctx.fillRect(sx,sy,sw,sh);
    ctx.strokeRect(sx,sy,sw,sh);
    ctx.setLineDash([]);
  }
}

cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  const [wx,wy] = screenToWorld(e.clientX-r.left, e.clientY-r.top);
  if (pan){
    view.x += e.clientX - pan.x;
    view.y += e.clientY - pan.y;
    pan = {x:e.clientX, y:e.clientY};
    draw(); return;
  }
  if (drag){
    const nx = Math.round(wx - drag.ox), ny = Math.round(wy - drag.oy);
    if (nx !== drag.p.x || ny !== drag.p.y){
      if (canPlace(drag.p.struct, nx, ny, drag.p)){ drag.p.x = nx; drag.p.y = ny; draw(); }
    }
    return;
  }
  if (hover){
    hover.x = Math.floor(wx); hover.y = Math.floor(wy);
    hover.valid = canPlace(hover.struct, hover.x, hover.y);
    draw();
  }
});

cv.addEventListener('mousedown', e=>{
  const r = cv.getBoundingClientRect();
  const [wx,wy] = screenToWorld(e.clientX-r.left, e.clientY-r.top);
  if (e.button === 1){ pan = {x:e.clientX, y:e.clientY}; e.preventDefault(); return; }
  if (e.button === 2) return;
  for (let i = placed.length-1; i>=0; i--){
    const p = placed[i];
    const [pw,ph] = p.struct.size;
    if (wx >= p.x && wx < p.x+pw && wy >= p.y && wy < p.y+ph){
      pushHistory();
      drag = {p, ox: wx-p.x, oy: wy-p.y};
      return;
    }
  }
});

addEventListener('mouseup', ()=>{ drag = null; pan = null; });

cv.addEventListener('contextmenu', e=>{
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const [wx,wy] = screenToWorld(e.clientX-r.left, e.clientY-r.top);
  for (let i = placed.length-1; i>=0; i--){
    const p = placed[i];
    const [pw,ph] = p.struct.size;
    if (wx >= p.x && wx < p.x+pw && wy >= p.y && wy < p.y+ph){
      pushHistory();
      placed.splice(i,1);
      draw(); update();
      return;
    }
  }
});

cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const [wx,wy] = screenToWorld(mx,my);
  view.scale *= e.deltaY < 0 ? 1.1 : 0.9;
  view.scale = Math.max(0.3, Math.min(3, view.scale));
  const [nx,ny] = worldToScreen(wx,wy);
  view.x += (mx-nx)/view.scale;
  view.y += (my-ny)/view.scale;
  draw();
}, {passive:false});

// catalog UI
const cat = document.getElementById('catalog');
CATALOG.forEach(s=>{
  const d = document.createElement('div');
  d.className = 'cat';
  d.innerHTML = `<span>${s.name}</span><small>${s.cost}</small>`;
  d.onclick = ()=> addStruct(s);
  cat.appendChild(d);
});

document.getElementById('undo').onclick = ()=>{
  if (history.length < 2) return;
  history.pop();
  const prev = JSON.parse(history[history.length-1]);
  placed = prev.map(o=>({struct: CATALOG.find(c=>c.name===o.name), x:o.x, y:o.y}));
  draw(); update();
  document.getElementById('undo').disabled = history.length < 2;
};

document.getElementById('clear').onclick = ()=>{ pushHistory(); placed = []; draw(); update(); };

document.getElementById('exportPng').onclick = ()=>{
  const off = document.createElement('canvas');
  off.width = GRID_W*CELL; off.height = GRID_H*CELL;
  const o = off.getContext('2d');
  o.fillStyle = '#0e1116'; o.fillRect(0,0,off.width,off.height);
  o.strokeStyle = '#1c2128';
  for (let x=0;x<=GRID_W;x++){ o.beginPath(); o.moveTo(x*CELL,0); o.lineTo(x*CELL,off.height); o.stroke(); }
  for (let y=0;y<=GRID_H;y++){ o.beginPath(); o.moveTo(0,y*CELL); o.lineTo(off.width,y*CELL); o.stroke(); }
  for (const p of placed){
    const [w0,h0] = p.struct.size;
    o.fillStyle = p.struct.color + '55';
    o.strokeStyle = p.struct.color;
    o.fillRect(p.x*CELL, p.y*CELL, w0*CELL, h0*CELL);
    o.strokeRect(p.x*CELL, p.y*CELL, w0*CELL, h0*CELL);
    o.fillStyle = '#fff'; o.font = '11px system-ui'; o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillText(p.struct.name, p.x*CELL + w0*CELL/2, p.y*CELL + h0*CELL/2);
  }
  const a = document.createElement('a');
  a.download = 'fob-layout.png';
  a.href = off.toDataURL('image/png');
  a.click();
};

document.getElementById('exportJson').onclick = ()=>{
  const data = { budget: BUDGET, layout: placed.map(p=>({name:p.struct.name, x:p.x, y:p.y})) };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.download = 'fob-layout.json';
  a.href = URL.createObjectURL(blob);
  a.click();
};

document.getElementById('importJson').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e=>{
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      const data = JSON.parse(r.result);
      pushHistory();
      placed = data.layout.map(o=>({struct: CATALOG.find(c=>c.name===o.name), x:o.x, y:o.y})).filter(p=>p.struct);
      draw(); update();
    } catch { alert('Bad JSON'); }
  };
  r.readAsText(f);
};

document.getElementById('share').onclick = ()=>{
  const data = placed.map(p=>({n:p.struct.name, x:p.x, y:p.y}));
  const code = btoa(JSON.stringify(data));
  const url = location.origin + location.pathname + '#FOB-' + code;
  navigator.clipboard.writeText(url);
  history.replaceState(null,'','#FOB-'+code);
  alert('Share link copied:\n' + url);
};

function loadFromHash(){
  if (!location.hash.startsWith('#FOB-')) return;
  try {
    const data = JSON.parse(atob(location.hash.slice(5)));
    placed = data.map(o=>({struct: CATALOG.find(c=>c.name===o.n), x:o.x, y:o.y})).filter(p=>p.struct);
    draw(); update();
  } catch {}
}

resize();
loadFromHash();
update();
</script>
</body>
</html>
